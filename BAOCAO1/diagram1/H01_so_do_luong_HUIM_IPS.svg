   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'Arial', 'DejaVu Sans'; fill: #0b0b0b" transform="translate(168.680563 176.7895)">Giao thức: model, θ, phạm vi, quy tắc, bộ định vị, ensemble đều chọn theo sai số trung bình trên 6 fold dev</text>
