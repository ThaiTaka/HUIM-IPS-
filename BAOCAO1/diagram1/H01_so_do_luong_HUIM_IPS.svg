   </g>
   <g id="text_11">
    <text style="font-size: 8.1px; font-family: 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="124.974" y="299.644832" transform="rotate(-0 124.974 299.644832)">HCXY: Ensemble trung vị: Chung C, θ = 1 % + Chung B, θ = 1 % + Theo vùng B, θ = 3 % · 193 AP · test_HCXY 1,58 m (ban đầu 2,12 m)</text>
   </g>
