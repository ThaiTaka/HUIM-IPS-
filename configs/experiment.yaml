# Experiment configuration — the values that were actually used.
#
# This file documents the configuration; the authoritative values live in the
# modules named below, and every result file records the configuration it was
# produced with. The file exists so a reader can see every knob in one place
# without reading five modules.

dataset:
  name: UJIIndoorLoc
  source: "Torres-Sospedra et al., IPIN 2014, DOI 10.1109/IPIN.2014.7275492"
  files:
    training: ujiindoorloc/UJIndoorLoc/trainingData.csv
    validation: ujiindoorloc/UJIndoorLoc/validationData.csv
  modified: false          # both CSVs are read-only; SHA-256 in results/data_summary.json
  not_detected_sentinel: 100
  rssi_documented_range_dbm: [-104, 0]
  n_wap_columns: 520       # verified empirically, not hard-coded (see inspect_data.py)

preprocessing:            # src/preprocess_uji.py
  rssi_representation: positive
  # q(i,T) = round(1 + (RSSI - RSSI_min)/(RSSI_max - RSSI_min) * (Q_MAX - 1))
  q_max: 100
  rssi_min_max_fitted_on: trainingData only
  not_detected_maps_to: item absent from the transaction
  empty_fingerprints: kept in the dataframe, dropped by the miner

target:
  primary_label: BUILDINGID_FLOOR
  n_classes: 13
  rejected_labels:
    - SPACEID            # identically 0 in validationData -> unusable
    - RELATIVEPOSITION   # identically 0 in validationData -> unusable

utility_models:           # src/utility_models.py
  shared_internal_utility: true   # so the ablation isolates p(i) alone
  A_signal:
    p: 1
    role: control condition
  B_discriminative:
    p: "max(I(A_i;Y), 1e-6) / max_j I(A_j;Y)"
    mi_estimator: joint histogram, deterministic, bits
    mi_signal_states: 6            # 1 "not detected" + 5 dBm bins
    rssi_bin_edges_dbm: [-104, -90, -80, -70, -60, 0]
    estimated_from: trainingData only
    leakage_guard: "build_external_utility raises unless split_name == 'training'"
  C_rare_discriminative:
    p: "I(A_i;Y) * log(N/(1+support_i)), normalised to (0,1]"
    role: optional third arm

huim:                     # src/huim/efim.py, src/run_huim.py
  algorithm: EFIM
  reference: "Zida et al., KAIS 51(2):595-625, DOI 10.1007/s10115-016-0986-0"
  implementation: Python re-implementation (no JVM available for SPMF)
  validated_against: brute-force oracle in src/huim/brute_force.py
  item_order: increasing TWU
  upper_bounds: [TWU (root), local utility, subtree utility]
  optimisations: [high-utility database projection, transaction merging,
                  fast utility counting]
  support_tracked: true    # merged transactions carry an occurrence count
  minutil_expressed_as: percentage of total database utility
  grid_pct_stage1: [20.0, 15.0, 10.0, 7.5, 5.0, 4.0, 3.5, 3.0, 2.5, 2.0, 1.5, 1.0]
  grid_stage2: geometric bisection between lowest COMPLETED and highest ABORTED
  max_bisections: 3
  rich_enough_huis: 20000
  budget_per_run:
    time_limit_s: 600
    max_huis: 1000000
  on_budget_exceeded: "controlled abort; STATUS = ABORTED_RESOURCE_LIMIT; partial
                       results kept, never deleted"
  persistence:
    save_full_hui_list_if_at_most: 50000
    always_save_top_huis: 1000

feature_selection:        # src/feature_selection.py
  ranking_score: "utility_contribution(i) = sum over HUIs X containing i of u(X)/|X|"
  modes:
    union: every WAP in at least one mined HUI (minUtil is the only knob)
    topn: the n highest-ranked WAPs
  alternatives_also_computed: [n_huis, max_hui_utility, mean_hui_utility,
                               support_weighted_contribution, n_top_huis]
  aborted_runs_used_for_ranking: false   # truncated HUI sets are DFS-order biased

ips:                      # src/ips_model.py, src/run_ips.py
  primary_classifier: k-NN
  knn_grid:
    n_neighbors: [1, 3, 5, 7, 9, 11]
    metric: [euclidean, manhattan]
    weights: [uniform, distance]
  hyperparameter_selection:
    on: "stratified 75/25 train_sub/dev_sub split of trainingData"
    features: ALL-WAP
    frozen_afterwards: true     # identical config for every condition
  secondary_classifier:
    name: RandomForest
    n_estimators: 200
    conditions: key conditions only
  final_fit: full trainingData
  final_test: validationData, once per condition
  coordinate_estimate: weighted k-NN regression from the same neighbours
  feature_budgets: [5, 10, 15, 20, 30, 40, 50, 75, 100, 150, 200, 300, 465]
  controls:
    random: {seeds: [1, 2, 3], pool: WAPs detected in trainingData}
    top_support: n most frequently detected WAPs
    top_mi: n WAPs with the highest mutual information
  random_seed: 20251007

metrics:
  classification: [building_accuracy, floor_accuracy,
                   joint_building_floor_accuracy, joint_macro_f1,
                   building_macro_f1, floor_macro_f1, floor_within_1_accuracy,
                   confusion_matrix]
  positioning_error:
    coordinate_system: "EPSG:3857 Web Mercator, identified empirically by
                        src/verify_coordinates.py (the dataset documents none)"
    reported_as: [projected metres (literature convention),
                  ground metres = projected x cos(latitude) = x 0.766126]
  mining: [runtime_s, peak_memory_delta_mb, n_huis, hui_length_distribution,
           unique_waps_in_huis, items_after_twu_pruning, search_nodes_visited,
           transactions_saved_by_merging]
  diagnostics: [val_rows_with_no_selected_wap_detected]

positioning_optimisation:  # src/optimize_positioning.py (PHASE I3)
  selection_split: "GroupKFold(6) over USERID on trainingData (leave-users-out)"
  selection_criterion: mean ground-metre error on the dev folds
  validation_used_for: evaluation only, once per stage
  stages: [S0 study k-NN, S1 representation x distance at k=1,
           S2 + k and 1/d^p weights, S3 + device-offset search,
           S4 + ensemble of two representations]
  grids:
    representations: [positive, powed, exponential]
    distances: [euclidean, manhattan, braycurtis, cosine]
    k: "1..20, 25, 30"
    weight_power_p: [0, 1, 2, 3, 4]
    device_offset_db: "+-3, +-6, +-9 in steps of 3"
  min_gain_m: 0.05          # a stage is adopted only if it buys this on dev
  neighbour_ties: "ordered by (distance, training row)"

memory_measurement:
  method: "background RSS sampling, 20 ms interval"
  rationale: "tracemalloc instruments every allocation and would corrupt the
              runtime measurements reported by the same experiment"

outputs:
  audit: [results/data_summary.json, results/data_audit.md]
  literature: [research/literature_review.md, research/papers_table.csv,
               research/references.bib, research/doi_verification.json]
  mining: [results/metrics/huim_runs.csv, results/huim_summary.json,
           results/hui/*]
  ips: [results/metrics/ips_results.csv, results/ips_summary.json]
  analysis: [research/reverse_thinking_analysis.md,
             results/reverse_thinking_observations.json,
             results/tables/ablation_study.csv]
  figures: "figures/*.png with a matching figures/*.csv per chart"
  deliverables: [report/HUIM_IPS_UJIIndoorLoc_Important_Knowledge.docx,
                 slides/HUIM_IPS_UJIIndoorLoc_Presentation.pptx,
                 slides/speaker_notes.md, FINAL_SUMMARY.md]
